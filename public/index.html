<!doctype html>
<html lang="fi">
<head>
<title>Pitkävetotulokset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: blue header band with tabs, filter chips, day-grouped match rows; result shown as 1/X/2 boxes */
:root {
  --brand: #023c8e;
  --brand-deep: #022352;
  --brand-ink: #ffffff;
  --accent: #ffc72c;
  --accent-ink: #1a1400;
  --bg: #eef2f8;
  --surface: #ffffff;
  --fg: #0f1c33;
  --muted: #5a6780;
  --line: #d9e0ec;
  --chip: #e3e9f4;
  --live: #d92d20;
  --win-bg: #fff4cc;
  --win-line: #e5a800;
  --c2: #8fa6cf;
  --x-tint: #fffaea;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-deep); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%); color: var(--brand-ink); }
header.top .wrap { padding-block: 20px 0; display: grid; gap: 6px; }
header.top .tabs { margin-top: 10px; }
.sub { margin: 0; font-size: 14px; opacity: .85; font-variant-numeric: tabular-nums; }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.updated { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
.status { display: flex; align-items: center; gap: 12px; }
.refresh { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--brand-ink); font: 600 13px var(--f-body); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.refresh:hover { background: rgba(255,255,255,.12); }
.refresh:focus-visible, .retry:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.refresh[disabled] { opacity: .7; cursor: progress; }
.refresh svg { width: 14px; height: 14px; }
.loading .refresh svg { animation: spin .9s linear infinite; }

/* Loading: indeterminate bar under header + skeleton rows */
.bar { position: relative; height: 3px; overflow: hidden; background: transparent; }
.loading .bar { background: rgba(255,198,44,.25); }
.loading .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
.skel .row { pointer-events: none; }
.sk { display: block; height: 12px; border-radius: 6px; background: var(--chip); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 1.3s infinite; }
.sk.t { width: 38px; height: 18px; }
.sk.m { width: 70px; height: 10px; margin-bottom: 7px; }
.sk.n { height: 15px; }
.sk.s { width: 54px; height: 24px; }
.sk.r { width: 110px; height: 30px; }
.loadnote { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding-block: 6px 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: pulse 1s ease-in-out infinite; }
.errbox { padding: 28px 16px; text-align: center; color: var(--fg); display: grid; gap: 12px; justify-items: center; }
.retry { appearance: none; border: 0; background: var(--brand); color: var(--brand-ink); font: 600 14px var(--f-body); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@keyframes shimmer { 100% { transform: translateX(100%); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .sk::after, .loading .refresh svg, .dot { animation: none; }
  .loading .bar::after { animation: none; width: 100%; opacity: .6; }
}

.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { appearance: none; border: 0; background: transparent; color: var(--brand-ink); opacity: .78; font: 600 16px var(--f-body); padding: 10px 16px 12px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--bg); color: var(--fg); opacity: 1; }
.tab:focus-visible, .chip:focus-visible, .search:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tab .n { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .7; margin-left: 4px; }

.controls { display: grid; gap: 10px; padding-block: 16px 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; border: 1px solid transparent; background: var(--chip); color: var(--fg); font: 600 14px var(--f-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.chips.leagues .chip { font-weight: 500; font-size: 13px; padding: 4px 10px; background: transparent; border-color: var(--line); }
.chips.leagues .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.search { width: 100%; max-width: 340px; font: 500 15px var(--f-body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }

.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding-block: 4px 8px; }
.legend b { font-weight: 700; color: var(--fg); }

.day { margin-block: 14px 0; }
.day h2, .tbl h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.row { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.time { font-family: var(--f-display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; }
.live { display: inline-block; background: var(--live); color: #fff; font: 700 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
.meta { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.match { min-width: 0; }
.teams { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.teams .vs { color: var(--muted); font-weight: 400; margin: 0 5px; }
.teams .l { color: var(--muted); font-weight: 500; }

.score { font-family: var(--f-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; white-space: nowrap; }
.score small { display: block; font: 600 12px var(--f-body); color: var(--muted); margin-top: 3px; letter-spacing: .02em; }

.res { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; }
.res span { display: grid; place-items: center; height: 30px; border: 1px solid var(--line); border-radius: 6px; font: 700 15px var(--f-display); color: var(--muted); background: var(--bg); }
.res span.on { background: var(--win-bg); border-color: var(--win-line); color: var(--fg); box-shadow: inset 0 0 0 1px var(--win-line); }
.res span.na { opacity: .3; }
.right { display: flex; align-items: center; gap: 14px; }

.tbl { margin-block: 14px 0; }
.tscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
thead th { border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--bg); }
th:nth-child(2), td:nth-child(2) { text-align: left; width: 100%; }
td:first-child { color: var(--muted); font-weight: 600; width: 2.5em; }
td:last-child, th:last-child { font-weight: 700; }
tbody tr:hover { background: var(--bg); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
/* Show filter (segmented) */
.seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); width: max-content; max-width: 100%; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--fg); font: 600 13px var(--f-body); padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.seg .c { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; font-weight: 500; }

/* Highlights */
.row.isx { background: var(--x-tint); box-shadow: inset 4px 0 0 var(--accent); }
.pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 700 10.5px var(--f-body); letter-spacing: .06em; text-transform: uppercase; background: var(--brand); color: var(--brand-ink); vertical-align: 1px; }
.pill.vl { background: var(--fg); color: var(--surface); }

/* League stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-block: 10px 4px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 13px; display: grid; gap: 9px; min-width: 0; }
.stat .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.stat .nm { font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.stat .ct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dist { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; }
.dist span { display: grid; place-items: center; min-width: 0; font: 700 13px var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.dist .o1 { background: var(--brand); color: var(--brand-ink); }
.dist .ox { background: var(--accent); color: var(--accent-ink); }
.dist .o2 { background: var(--c2); color: #0f1c33; }
.dk { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dk b { color: var(--fg); font-weight: 700; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; border-top: 1px solid var(--line); padding-top: 9px; font-size: 13px; }
.facts div { display: flex; flex-direction: column; }
.facts span { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.facts b { font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.nx { list-style: none; margin: 0; padding: 0; display: grid; }
.nx li { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.nx li:first-child { border-top: 0; padding-top: 2px; }
.nx .when { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.nx .when b { display: block; color: var(--fg); font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.nx .who { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.nx .who span { color: var(--muted); font-weight: 400; margin: 0 4px; }
.nx-empty { color: var(--muted); font-size: 13px; }
.stats-title { margin: 22px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--fg); display: flex; align-items: baseline; gap: 10px; }
.stats-title small { font: 600 13px var(--f-body); color: var(--muted); }
/* Played games: own clearly separated section */
.played { margin-top: 36px; padding-top: 18px; border-top: 3px solid var(--brand); }
.played .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.played h2.sec { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 28px; color: var(--brand); }
.played h2.sec small { font: 600 14px var(--f-body); color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.played .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.played .tools .search { flex: 1 1 220px; }
.played .day:first-child { margin-top: 18px; }

.main { padding-bottom: 32px; }
footer { color: var(--muted); font-size: 13px; padding-block: 28px 32px; max-width: 70ch; display: grid; gap: 6px; }
footer p { margin: 0; }

@media (max-width: 600px) {
  .row { grid-template-columns: 50px minmax(0,1fr) auto; gap: 4px 10px; padding: 10px 12px; }
  .row .right { grid-column: 2 / -1; justify-content: space-between; }
  .row.upcoming .right { display: none; }
  h1 { font-size: 26px; }
  .tab { padding: 9px 12px 11px; font-size: 15px; }
  .score { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) { .chip, .tab { transition: background .15s, color .15s; } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <h1>Pitkäveto<span>tulokset</span></h1>
      <div class="status">
        <div class="updated" id="updated" aria-live="polite"></div>
        <button class="refresh" id="refresh" type="button" aria-label="Päivitä tulokset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Päivitä</button>
      </div>
    </div>
    <p class="sub"><span id="n-done"></span> pelattua ottelua · 1X2-tulokset varsinaisen peliajan mukaan</p>
    <div class="tabs" id="sports" role="tablist" aria-label="Laji"></div>
  </div>
  <div class="bar" aria-hidden="true"></div>
</header>

<main class="wrap main">
  <div class="controls">
    <div class="chips leagues" id="leagues" aria-label="Sarja"></div>
  </div>
  <div id="statwrap"></div>
  <div id="nextwrap"></div>
  <section class="played" aria-labelledby="played-title">
    <div class="sec-head">
      <h2 class="sec" id="played-title">Pelatut ottelut<small id="n-played"></small></h2>
    </div>
    <div class="tools">
      <div class="seg" id="show" role="group" aria-label="Näytä"></div>
      <input class="search" id="q" type="search" placeholder="Hae joukkuetta…" aria-label="Hae joukkuetta">
    </div>
    <div id="out"></div>
  </section>
</main>

<script>
let DATA = null;
const SPORTS = { ih: "Jääkiekko", fb: "Jalkapallo", bb: "Koripallo" };
const TZ = "Europe/Helsinki";
const fmtTime = new Intl.DateTimeFormat("fi-FI", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const fmtDay = new Intl.DateTimeFormat("fi-FI", { timeZone: TZ, weekday: "long", day: "numeric", month: "numeric" });
const fmtKey = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const fmtStamp = new Intl.DateTimeFormat("fi-FI", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });

let leagues = [];
let games = [];
let loadError = "";

let state = { tab: "done", sport: "ih", league: "all", q: "", show: "all" };
try { Object.assign(state, JSON.parse(localStorage.getItem("pvs-results") || "{}"), { q: "", tab: "done" }); } catch (e) {}
if (!SPORTS[state.sport]) state.sport = "ih";
function save() { try { localStorage.setItem("pvs-results", JSON.stringify({ tab: state.tab, sport: state.sport, league: state.league, show: state.show })); } catch (e) {} }

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]); }

function dayLabel(key, sample) {
  const today = fmtKey.format(new Date());
  const d = new Date(today + "T12:00:00");
  const k = new Date(key + "T12:00:00");
  const diff = Math.round((k - d) / 864e5);
  const base = fmtDay.format(sample);
  if (diff === 0) return "Tänään · " + base;
  if (diff === 1) return "Huomenna · " + base;
  if (diff === -1) return "Eilen · " + base;
  return base;
}

function outcome(g) {
  // Regulation-time 1X2: hockey games decided in OT/shootout count as X.
  if (g.hs == null || g.as == null) return null;
  if (g.sport === "ih" && g.note) return 1;
  if (g.sport === "fb" && (g.note === "ja" || g.note === "rp")) return 1;
  let h = g.hs, a = g.as;
  return h > a ? 0 : h < a ? 2 : 1;
}

function renderChips() {
  const sp = document.getElementById("sports"); sp.innerHTML = "";
  Object.entries(SPORTS).forEach(([k, label]) => {
    const n = DATA ? games.filter(g => g.status === "post" && (k === "all" || g.sport === k)).length : "";
    const b = el("button", "tab", esc(label) + '<span class="n">' + n + "</span>"); b.type = "button"; b.id = "sport-" + k;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", state.sport === k);
    b.onclick = () => { state.sport = k; state.league = "all"; save(); render(); };
    sp.appendChild(b);
  });
  const lg = document.getElementById("leagues"); lg.innerHTML = "";
  const list = leagues.filter(l => (state.sport === "all" || l.sport === state.sport) && (state.tab !== "tbl" || l.tables.length));
  const opts = state.tab === "tbl" ? list.map(l => [l.name, l.name]) : [["all","Kaikki sarjat"], ...list.map(l => [l.name, l.name])];
  opts.forEach(([k, label]) => {
    const b = el("button", "chip", esc(label)); b.type = "button"; b.id = "league-" + k.replace(/\s/g, "-");
    b.setAttribute("aria-pressed", state.league === k);
    b.onclick = () => { state.league = k; save(); render(); };
    lg.appendChild(b);
  });
}

const isOT = g => !!g.note;
const isX = g => outcome(g) === 1;

// League + sport filter only (stats use this)
function scoped() {
  return games.filter(g => g.status === "post"
    && (state.sport === "all" || g.sport === state.sport)
    && (state.league === "all" || g.league === state.league));
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  return scoped().filter(g => {
    if (state.show === "x" && !isX(g)) return false;
    if (state.show === "ot" && !isOT(g)) return false;
    if (q && !(g.home + " " + g.away).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderShow() {
  const base = scoped();
  const hasX = base.some(g => g.sport !== "bb");
  const opts = [["all", "Kaikki", base.length], ["x", "Tasapelit (X)", base.filter(isX).length], ["ot", "Jatkoajat", base.filter(isOT).length]];
  if (!hasX && state.show === "x") state.show = "all";
  const box = document.getElementById("show"); box.innerHTML = "";
  opts.forEach(([k, label, n]) => {
    if (k === "x" && !hasX) return;
    const b = el("button", "", esc(label) + '<span class="c">' + (DATA ? n : "") + "</span>");
    b.type = "button"; b.id = "show-" + k;
    b.setAttribute("aria-pressed", state.show === k);
    b.onclick = () => { state.show = k; save(); render(); };
    box.appendChild(b);
  });
}

const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const dec = v => v.toFixed(1).replace(".", ",");

const fmtShort = new Intl.DateTimeFormat("fi-FI", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric" });
function renderNext() {
  const wrap = document.getElementById("nextwrap"); wrap.innerHTML = "";
  if (!DATA) return;
  const list = leagues.filter(l => l.sport === state.sport && (state.league === "all" || l.name === state.league));
  if (!list.length) return;
  const single = list.length === 1;
  wrap.appendChild(el("h2", "stats-title", "Seuraavat ottelut<small>" + (single ? "15 seuraavaa" : "5 seuraavaa per sarja") + "</small>"));
  const grid = el("div", "stats");

  // One card = up to 5 games. Single league: split its next 15 into three cards (1–5, 6–10, 11–15).
  const cards = [];
  list.forEach(l => {
    const up = l.upcoming || [];
    if (!single) { cards.push({ title: l.name, games: up.slice(0, 5) }); return; }
    for (let i = 0; i < 15; i += 5) {
      const chunk = up.slice(i, i + 5);
      if (!chunk.length && i > 0) break;
      cards.push({ title: l.name, sub: "ottelut " + (i + 1) + ".–" + (i + chunk.length) + ".", games: chunk });
    }
  });

  cards.forEach(c => {
    const card = el("div", "stat");
    card.appendChild(el("div", "hd", '<span class="nm">' + esc(c.title) + "</span>" + (c.sub ? '<span class="ct">' + esc(c.sub) + "</span>" : "")));
    if (!c.games.length) { card.appendChild(el("div", "nx-empty", "Ei otteluita seuraavaan kahteen viikkoon.")); grid.appendChild(card); return; }
    const ul = el("ul", "nx");
    c.games.forEach(g => {
      const d = new Date(g.t);
      ul.appendChild(el("li", "",
        '<span class="when"><b>' + fmtTime.format(d) + "</b>" + fmtShort.format(d) + "</span>" +
        '<span class="who">' + esc(g.home) + "<span>–</span>" + esc(g.away) + "</span>"));
    });
    card.appendChild(ul);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}

function renderStats() {
  const wrap = document.getElementById("statwrap"); wrap.innerHTML = "";
  if (!DATA) return;
  const base = scoped();
  const names = [...new Set(base.map(g => g.league))];
  const order = leagues.map(l => l.name);
  names.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  if (!names.length) return;
  wrap.appendChild(el("h2", "stats-title", "Tilastot<small>viimeiset 14 päivää</small>"));
  const grid = el("div", "stats");
  names.forEach(name => {
    const gs = base.filter(g => g.league === name);
    const sport = gs[0].sport;
    const n = gs.length;
    const c = [0, 0, 0]; gs.forEach(g => c[outcome(g)]++);
    const p = c.map(v => pct(v, n));
    const ot = gs.filter(isOT).length;
    const goals = gs.reduce((s, g) => s + g.hs + g.as, 0) / n;
    const card = el("div", "stat");
    card.appendChild(el("div", "hd", '<span class="nm">' + esc(name) + '</span><span class="ct">' + n + " ottelua</span>"));
    const bar = el("div", "dist");
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", "(1) " + p[0] + "%, (X) " + p[1] + "%, (2) " + p[2] + "%");
    [["o1", "1", c[0], p[0]], ["ox", "X", c[1], p[1]], ["o2", "2", c[2], p[2]]].forEach(([cls, k, v, pp]) => {
      if (!v) return;
      const sg = el("span", cls, pp >= 14 ? "(" + k + ") " + pp + "%" : (pp >= 7 ? "(" + k + ")" : ""));
      sg.style.flex = String(v);
      sg.title = "(" + k + ") " + pp + "% · " + v + " ottelua";
      bar.appendChild(sg);
    });
    card.appendChild(bar);
    card.appendChild(el("div", "dk",
      "<span><b>(1)</b> " + p[0] + "% · " + c[0] + "</span>" +
      (sport === "bb" ? "" : "<span><b>(X)</b> " + p[1] + "% · " + c[1] + "</span>") +
      "<span><b>(2)</b> " + p[2] + "% · " + c[2] + "</span>"));
    const unit = sport === "bb" ? "Pisteitä / ottelu" : "Maaleja / ottelu";
    const otLabel = sport === "fb" ? "Jatkoajalle" : "Jatkoajalle / vl";
    card.appendChild(el("div", "facts",
      "<div><span>" + unit + "</span><b>" + dec(goals) + "</b></div>" +
      "<div><span>" + otLabel + "</span><b>" + pct(ot, n) + "% · " + ot + "</b></div>"));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}

function resBoxes(g) {
  const r = outcome(g);
  const box = el("div", "res");
  ["1","X","2"].forEach((k, i) => {
    const s = el("span", (i === r ? "on" : "") + (g.sport === "bb" && i === 1 ? " na" : ""), k);
    box.appendChild(s);
  });
  box.setAttribute("aria-label", "1X2-tulos " + (r == null ? "–" : ["1","X","2"][r]));
  return box;
}

function gameRow(g) {
  const isUp = g.status === "pre";
  const row = el("div", "row" + (isUp ? " upcoming" : "") + (g.status === "post" && isX(g) ? " isx" : ""));
  row.appendChild(el("div", "time", g.status === "in" ? '<span class="live">Live</span>' : fmtTime.format(g.date)));
  const m = el("div", "match");
  const pill = g.note ? '<span class="pill ' + g.note + '">' + ({ ja: "Jatkoaika", vl: "Voittolaukaukset", rp: "Rangaistuspotkut" }[g.note] || g.note) + "</span>" : "";
  m.appendChild(el("div", "meta", esc(g.league) + pill));
  let hc = "", ac = "";
  if (g.status === "post" && g.hs != null) { if (g.hs > g.as) ac = "l"; else if (g.as > g.hs) hc = "l"; }
  m.appendChild(el("div", "teams", '<span class="' + hc + '">' + esc(g.home) + '</span><span class="vs">–</span><span class="' + ac + '">' + esc(g.away) + '</span>'));
  row.appendChild(m);
  if (!isUp) {
    const right = el("div", "right");
    let sub = "";
    if (g.note) {
      sub = g.regH != null ? "60 min " + g.regH + "–" + g.regA : "";
    } else if (g.status === "in") sub = "käynnissä";
    right.appendChild(el("div", "score", g.hs + "–" + g.as + (sub ? "<small>" + esc(sub) + "</small>" : "")));
    if (g.status === "post") right.appendChild(resBoxes(g));
    row.appendChild(right);
  } else {
    row.appendChild(el("div", "right"));
  }
  return row;
}

function renderGames(out, rows, asc) {
  rows.sort((a, b) => asc ? a.date - b.date : b.date - a.date);
  if (!rows.length) { out.appendChild(el("div", "list", '<div class="empty">Ei otteluita näillä valinnoilla.</div>')); return; }
  const groups = new Map();
  rows.forEach(g => { const k = fmtKey.format(g.date); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(g); });
  groups.forEach((rs, k) => {
    const sec = el("section", "day");
    sec.appendChild(el("h2", "", dayLabel(k, rs[0].date)));
    const list = el("div", "list");
    rs.forEach(g => list.appendChild(gameRow(g)));
    sec.appendChild(list);
    out.appendChild(sec);
  });
}

function renderTables(out) {
  const list = leagues.filter(l => l.tables.length && (state.sport === "all" || l.sport === state.sport));
  const lg = list.find(l => l.name === state.league) || list[0];
  if (!lg) { out.appendChild(el("div", "list", '<div class="empty">Ei sarjataulukkoa.</div>')); return; }
  const q = state.q.trim().toLowerCase();
  lg.tables.forEach(t => {
    const sec = el("section", "tbl");
    sec.appendChild(el("h2", "", esc(lg.name + " · " + t.name)));
    const wrap = el("div", "tscroll");
    let h = "<table><thead><tr><th>#</th><th>Joukkue</th>" + t.cols.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>";
    t.rows.forEach(r => {
      if (q && !String(r.team).toLowerCase().includes(q)) return;
      h += "<tr><td>" + esc(r.rank) + "</td><td>" + esc(r.team) + "</td>" + r.c.map(v => "<td>" + esc(v) + "</td>").join("") + "</tr>";
    });
    wrap.innerHTML = h + "</tbody></table>";
    sec.appendChild(wrap);
    out.appendChild(sec);
  });
}

function render() {
  if (state.tab === "tbl") {
    if (state.sport === "all") state.sport = "ih";
    const ok = leagues.some(l => l.name === state.league && l.tables.length && l.sport === state.sport);
    if (!ok) { const f = leagues.find(l => l.sport === state.sport && l.tables.length); state.league = f ? f.name : "all"; }
  } else if (DATA && state.league !== "all" && !leagues.some(l => l.name === state.league && (state.sport === "all" || l.sport === state.sport))) {
    state.league = "all";
  }
  renderChips();
  renderShow();
  renderStats();
  renderNext();
  const rows = filtered();
  const up = rows.filter(g => g.status !== "post"), done = rows.filter(g => g.status === "post");
  document.getElementById("n-done").textContent = done.length;
  document.getElementById("n-played").textContent = DATA ? done.length + " ottelua" : "";
  const out = document.getElementById("out"); out.innerHTML = "";
  if (!DATA) {
    if (loadError) { out.appendChild(errorBox()); return; }
    out.appendChild(skeleton());
    return;
  }
  if (state.tab === "tbl") renderTables(out);
  else renderGames(out, state.tab === "up" ? up : done, state.tab === "up");
}

function skeleton() {
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div", "loadnote", '<span class="dot"></span>Haetaan tuoreita tuloksia Liigasta, Mestikseltä ja ESPN:stä…'));
  [5, 4].forEach(n => {
    const sec = el("section", "day skel");
    sec.appendChild(el("h2", "", '<span class="sk" style="width:150px;height:12px"></span>'));
    const list = el("div", "list");
    for (let i = 0; i < n; i++) {
      list.appendChild(el("div", "row",
        '<span class="sk t"></span>' +
        '<div class="match"><span class="sk m"></span><span class="sk n" style="width:' + (52 + (i * 13) % 30) + '%"></span></div>' +
        '<div class="right"><span class="sk s"></span><span class="sk r"></span></div>'));
    }
    sec.appendChild(list);
    frag.appendChild(sec);
  });
  return frag;
}

function errorBox() {
  const box = el("div", "list");
  const inner = el("div", "errbox", "<span>" + esc(loadError) + "</span>");
  const b = el("button", "retry", "Yritä uudelleen"); b.type = "button"; b.id = "retry";
  b.onclick = () => load();
  inner.appendChild(b);
  box.appendChild(inner);
  return box;
}

let loading = false;
function setLoading(on) {
  loading = on;
  document.documentElement.classList.toggle("loading", on);
  const b = document.getElementById("refresh");
  b.disabled = on;
  b.lastChild.textContent = on ? "Päivitetään…" : "Päivitä";
}

async function load() {
  if (loading) return;
  loadError = "";
  setLoading(true);
  render();
  try {
    const r = await fetch("/api/results", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    leagues = DATA.leagues || [];
    games = [];
    leagues.forEach(l => l.games.forEach(g => games.push(Object.assign({ league: l.name, sport: l.sport, date: new Date(g.t) }, g))));
    document.getElementById("updated").textContent = "Päivitetty " + fmtStamp.format(new Date(DATA.generated));
  } catch (e) {
    if (!DATA) loadError = "Tulosten haku epäonnistui. Tarkista nettiyhteys ja yritä uudelleen.";
    else document.getElementById("updated").textContent = "Päivitys epäonnistui, näytetään edelliset tulokset";
  }
  setLoading(false);
  render();
}
document.getElementById("refresh").addEventListener("click", () => load());
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
load();
</script>
</body>

</html>
